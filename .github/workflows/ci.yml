name: Offline CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  offline-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Python test suites
      run: |
        python -m pytest app/tests/ depgraph/tests/ warehouse/tests/ reference/tests/

    - name: Set up C++ Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-11 cmake

    - name: Build C++ Replay Engine
      run: |
        cmake -B build -DCMAKE_CXX_COMPILER=g++-11
        cmake --build build

    - name: Run C++ Engine Tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Run CLI Replay Demonstration
      run: |
        ./build/markettrace_cli fixtures/clean_run.json
        ./build/markettrace_cli fixtures/faulted_run.json
